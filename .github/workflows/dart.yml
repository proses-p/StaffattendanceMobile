name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. HII NDIYO HATUA ILIYOKOSEKANA (Kuweka Flutter SDK)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. Tumia 'flutter pub get' badala ya 'dart pub get'
      - name: Get Flutter dependencies
        run: flutter pub get

      # 3. Jenga iOS bila kuweka saini ya Apple Developer (Unsigned IPA)
      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      # 4. Fungasha (Package) kuwa faili la .ipa
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y StaffAttendance.ipa Payload

      # 5. Pakia faili la .ipa ili uweze kulidownload kwenye GitHub
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaffAttendance-IPA
          path: StaffAttendance.ipa
