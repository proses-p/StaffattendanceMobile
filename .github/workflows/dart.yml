name: Build iOS Appetize Simulator & IPA

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Ensure iOS project files exist
        run: flutter create --platforms=ios .

      - name: Build iOS Simulator App
        run: |
          flutter build ios --simulator --release 
          rm -rf appetize_stage && mkdir -p appetize_stage
          cp -R build/ios/iphonesimulator/Runner.app appetize_stage/

      - name: Upload Appetize Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: Runner.app
          path: appetize_stage/Runner.app

      - name: Build Unsigned Device IPA
        run: |
          flutter build ios --config-only --release --no-codesign
          WORKSPACE_FLAG="-project ios/Runner.xcodeproj"
          if [ -d "ios/Runner.xcworkspace" ]; then
            WORKSPACE_FLAG="-workspace ios/Runner.xcworkspace"
          fi
          xcodebuild $WORKSPACE_FLAG \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""
          rm -rf Payload && mkdir -p Payload
          cp -R build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r -y StaffAttendance.ipa Payload

      - name: Upload Device IPA
        uses: actions/upload-artifact@v4
        with:
          name: StaffAttendance-IPA
          path: StaffAttendance.ipa
