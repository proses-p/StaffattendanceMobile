name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Ensure iOS project files & Podfile exist
        run: flutter create --platforms=ios .

      - name: Prepare Flutter iOS build
        run: flutter build ios --config-only --release --no-codesign

      - name: Install CocoaPods (if Podfile exists)
        working-directory: ios
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build Unsigned Runner.app
        run: |
          if [ -d "ios/Runner.xcworkspace" ]; then
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/ios_derived \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project ios/Runner.xcodeproj \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/ios_derived \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r -y StaffAttendance.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StaffAttendance-IPA
          path: StaffAttendance.ipa
